<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa en Orden</title>
    <!-- Aplica el tema antes de dibujar la página (evita un destello claro en modo oscuro).
         La misma lógica está en src/features/theme/theme.ts. -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        // Por defecto oscuro; "system" sigue al sistema operativo.
        var dark =
          stored === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored !== 'light'
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
