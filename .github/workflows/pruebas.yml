# Pruebas y revisión de seguridad en cada cambio que se sube.
#
# Railway espera a que esto termine bien antes de publicar ("Wait for CI" en la configuración del
# servicio): si algo falla, sigue funcionando la versión anterior. Ver README, "Pruebas antes de
# publicar".
#
# La prueba de punta a punta en un navegador (e2e.cmd) se corre en la PC: acá sería lenta.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor:
    name: Servidor (pruebas, estilo y dependencias)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Base de pruebas propia de esta ejecución (se descarta al terminar).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: casa
          POSTGRES_PASSWORD: solo-para-pruebas
          POSTGRES_DB: casa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U casa" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://casa:solo-para-pruebas@localhost:5432/casa_test
      TEST_DATABASE_URL: postgresql+psycopg://casa:solo-para-pruebas@localhost:5432/casa_test
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Las pruebas de copias de seguridad usan pg_dump y pg_restore (versión 18, como la base).
      - name: Instalar pg_dump 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt pip-audit==2.10.1

      - name: Estilo y errores comunes (ruff)
        run: |
          ruff check app tests ../e2e
          ruff format --check app tests

      - name: Pruebas
        run: python -m pytest -q -p no:cacheprovider

      - name: Vulnerabilidades conocidas en las librerías
        run: pip-audit -r requirements.txt

  pantallas:
    name: Pantallas (pruebas, compilación y dependencias)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Estilo y errores comunes (eslint)
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      # Solo lo que llega al navegador; "high" para no frenar por avisos menores de herramientas.
      - name: Vulnerabilidades conocidas en las librerías
        run: npm audit --omit=dev --audit-level=high
